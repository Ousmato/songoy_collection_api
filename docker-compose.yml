services:
  songoycollection-api:
    image: songoycollection-api:latest
    container_name: songoycollection-api
    restart: unless-stopped
    ports:
      # The API is published only to the VPS itself. Nginx terminates HTTPS and
      # proxies /api/ to this port; the Java process still listens on 8080 in
      # the container. 8085 avoids the host port already used by usgestion.
      - "127.0.0.1:${APP_HOST_PORT:?APP_HOST_PORT must be set in .env}:8080"
    env_file:
      - .env
    environment:
      # Container paths are fixed; their persistent host directory is configured
      # through APP_UPLOADS_DIR in the VPS .env file.
      APP_UPLOAD_DIR: /app/uploads
      APP_PERSONNEL_UPLOAD_DIR: /app/uploads/personnel
    volumes:
      - "${APP_UPLOADS_DIR:?APP_UPLOADS_DIR must be set in .env}:/app/uploads"
    extra_hosts:
      # Allows DB_HOST=host.docker.internal when MySQL runs directly on the VPS.
      - "host.docker.internal:host-gateway"
    networks:
      - songoycollection-network

networks:
  songoycollection-network:
    name: songoycollection-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/24
