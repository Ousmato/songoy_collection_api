spring.application.name=songoycollection
spring.config.import=optional:file:.env[.properties]
logging.level.org.springframework.boot.autoconfigure.logging=INFO

# Base de donnees locale
spring.datasource.url=jdbc:mysql://${DB_HOST:${MYSQL_HOST:localhost}}:${DB_PORT:3306}/${DB_NAME}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Super Admin au premier demarrage s'il n'existe pas
app.default-super-admin.nom=${DEFAULT_SUPER_ADMIN_NOM:SUPER}
app.default-super-admin.prenom=${DEFAULT_SUPER_ADMIN_PRENOM:ADMIN}
app.default-super-admin.telephone=${DEFAULT_SUPER_ADMIN_TELEPHONE:76000000}
app.default-super-admin.adresse=${DEFAULT_SUPER_ADMIN_ADRESSE:Bamako}

# API et documentation
server.port=${SERVER_PORT:8080}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Uploads (optionnels pour les premiers ecrans)
app.upload-dir=${APP_UPLOAD_DIR}
app.personnel-upload-dir=${APP_PERSONNEL_UPLOAD_DIR}

# CORS du front Angular local
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Fichiers envoyés
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=100MB

# Logs utiles en developpement
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.songoycollection=DEBUG
