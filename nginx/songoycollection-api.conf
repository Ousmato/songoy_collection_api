# Include this file inside the existing HTTPS `server` block for
# boutique.yelensoft.org. It preserves the /api/v1 path sent to Spring Boot.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8085;
    proxy_http_version 1.1;
    # Must be at least Spring's multipart max-request-size (100MB).
    client_max_body_size 100m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
}

# The Docker volume is persisted here on the VPS. `alias` must end with `/`.
location ^~ /uploads/ {
    alias /home/songoydeploy/data/songoycollection/uploads/;
    expires 7d;
    add_header Cache-Control "public";
}
